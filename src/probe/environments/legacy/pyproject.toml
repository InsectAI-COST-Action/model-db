[project]
name = "model-db-probe-legacy"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "ultralytics==8.3.0",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "pandas==2.2.3",
  "matplotlib==3.9.4",
  "seaborn==0.13.2",
  "pillow==11.1.0",
  "pyyaml==6.0.2",
  "requests==2.32.3",
  "scipy==1.15.2",
  "tqdm==4.67.1",
  "psutil==7.0.0",
  "thop==0.1.1.post2209072238",
  "gitpython==3.1.44",
  "setuptools==75.8.2",
  "packaging==24.2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

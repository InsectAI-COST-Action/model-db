# ═══════════════════════════════════════════════════════════════════════════════
#  Category taxonomy for the model zoo.
# ═══════════════════════════════════════════════════════════════════════════════
#
#  A model card's `category` must be one of the slugs below, or the build stops
#  and says so.
#
#  Adding a category: add it to `order` AND to the [categories.*] table. A slug
#  in one but not the other gets you either a section that never renders or a
#  build error naming every card that uses it.
# ═══════════════════════════════════════════════════════════════════════════════

# order is the order in which categories appear on the home page.
order = [
  "detection-homogeneous",
  "detection-heterogeneous",
  "classification",
  "foundation",
]

[categories.detection-homogeneous]
title = "Detection on homogeneous backgrounds"
short = "Homogeneous"
description = """
Detectors trained and evaluated on uniform backgrounds: light boxes, conveyor
belts, plain walls, sticky traps, and laboratory surfaces, where the insect is
the only thing in frame.
"""
open = true # open so that the section is not collapsed on the home page.

[categories.detection-heterogeneous]
title = "Detection on heterogeneous backgrounds"
short = "Heterogeneous"
description = """
Detectors trained on cluttered field imagery: flowers, foliage, soil, and
natural substrate, where the insect occupies a small fraction of a visually
busy frame.
"""
open = true

[categories.classification]
title = "Insect classification"
short = "Classification"
description = """
Species- or taxon-level classifiers operating on cropped images of individual
specimens.
"""
open = true

[categories.foundation]
title = "Foundation models"
short = "Foundation"
description = """
General-purpose vision models usable zero-shot or through prompting, rather
than trained for a single insect task. These accept textual or visual prompts
and are not bound to a fixed class list.
"""
open = true

# ═══════════════════════════════════════════════════════════════════════════════
#  Category taxonomy for the model zoo.
# ═══════════════════════════════════════════════════════════════════════════════
#
#  A model card's `category` must be one of the slugs below, or the build stops
#  and says so.
#
#  Adding a category: add it to `order` AND to the [categories.*] table. A slug
#  in one but not the other gets you either a section that never renders or a
#  build error naming every card that uses it.
# ═══════════════════════════════════════════════════════════════════════════════

# order is the order in which categories appear on the home page.
order = [
  "detection",
  "classification",
  "regression",
  "embeddings"
]

[categories.detection]
title = "Insect detection"
short = "Detection"
description = """
Models trained to detect insects in images or video. They can be trained and 
evaluated on either uniform backgrounds or visually cluttered field imagery. 
"""
open = true # open so that the section is not collapsed on the home page.

[categories.classification]
title = "Insect classification"
short = "Classification"
description = """
Models that predict species-level ( or other taxonomic rank) labels for insects. 
They typically take as input cropped images of individual specimens.
"""
open = true

[categories.trait-quantification]
title = "Trait quantification models"
short = "Trait quantification"
description = """
Models that give a single continuous variable as the output, for example counting 
insects in an image, or estimating biomass of a specimen. 
"""
open = true

[categories.embeddings]
title = "Embeddings models"
short = "Embeddings"
description = """
Models to be used as feature extractors, producing embeddings that can be paired 
with a prediction head for downstream tasks such as classification or regression. 
These models are not directly applicable to a specific insect task, but are 
good starting points for building your own models. 
"""
open = true # closed so that the section is collapsed on the home page.
